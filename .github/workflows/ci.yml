name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- 1. 全历史 secret 扫描 ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 2. 仓库结构校验（broken link / references / frontmatter / secret pattern）----
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 仓库校验
        run: python scripts/validate_repo.py

  # ---- 3. 脚本语法检查 ----
  script-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell 语法检查（sync / push_back 脚本）
        run: |
          bash -n scripts/sync_to_hermes.sh
          bash -n scripts/push_back_to_repo.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 语法检查
        run: |
          python -m py_compile scripts/validate_repo.py
          python -m py_compile scripts/upload_gif.py
          python -m py_compile scripts/clean_lesson2.py
          python -m py_compile scripts/sync_theme_routing_fix.py
          python -m py_compile skills/andiii-image-style/scripts/crop_image.py
          python -m py_compile skills/andiii-image-style/scripts/check_engine_prompt.py
          python -m py_compile skills/andiii-crt-style/scripts/check_crt_prompt.py
          python -m py_compile skills/andiii-crt-style/scripts/finalize_crt.py
          python -m py_compile skills/ai-image-style-engine/scripts/batch_gate_check.py
          python -m py_compile skills/gzh-design-skill/scripts/validate_gzh_html.py
          python -m py_compile skills/gzh-design-skill/scripts/component_lint.py
          python -m py_compile skills/gzh-design-skill/scripts/wrap_preview.py
          python -m py_compile skills/gzh-design-skill/scripts/extract_docx.py
      - name: gzh-design 校验器冒烟测试（标签平衡/禁用项三态）
        run: |
          set +e
          printf '<section><p><span leaf="">你好</span></p></section>' | python skills/gzh-design-skill/scripts/validate_gzh_html.py --stdin > /dev/null 2>&1
          [ $? -eq 0 ] || { echo "平衡 HTML 应通过"; exit 1; }
          printf '<section><p><span leaf="">你好</span></p>' | python skills/gzh-design-skill/scripts/validate_gzh_html.py --stdin > /dev/null 2>&1
          [ $? -eq 1 ] || { echo "未闭合 section 应报 ERROR"; exit 1; }
          printf '<div><span leaf="">你好</span></div>' | python skills/gzh-design-skill/scripts/validate_gzh_html.py --stdin > /dev/null 2>&1
          [ $? -eq 1 ] || { echo "禁用 div 应报 ERROR"; exit 1; }
          echo "gzh-design smoke test PASS"
      - name: 质检门冒烟测试（PASS/WARN/FAIL 三态 + JSON）
        run: |
          set +e
          echo "cold-pressed paper, brush stroke, 晕染, 16:9" | python skills/andiii-image-style/scripts/check_engine_prompt.py > /dev/null 2>&1
          [ $? -eq 0 ] || { echo "PASS 态退出码错误"; exit 1; }
          echo "cold-pressed paper, brush stroke, 晕染, 16:9, high saturation" | python skills/andiii-image-style/scripts/check_engine_prompt.py > /dev/null 2>&1
          [ $? -eq 2 ] || { echo "WARN 态退出码错误"; exit 1; }
          echo "cold-pressed paper, brush stroke, 晕染, 16:9, neon glow" | python skills/andiii-image-style/scripts/check_engine_prompt.py > /dev/null 2>&1
          [ $? -eq 1 ] || { echo "FAIL 态退出码错误"; exit 1; }
          echo "smoke test PASS"
